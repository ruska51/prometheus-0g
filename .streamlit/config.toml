# Style "Science agency" (ADR-064): white pages, dark cover band, bold grotesque type, one red-orange accent.
[theme]
base = "light"
primaryColor = "#D9461E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F4F6"
textColor = "#111318"
linkColor = "#0B5CAD"
borderColor = "#E2E4E8"
font = "Public Sans:https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap, sans-serif"
headingFont = "Public Sans:https://fonts.googleapis.com/css2?family=Public+Sans:wght@700;800&display=swap, sans-serif"
baseRadius = "0.35rem"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
chartCategoricalColors = ["#D2571F", "#1F5FA8", "#2A9D8F", "#6B7280", "#E9A23B", "#2F855A", "#B83280"]

[client]
toolbarMode = "viewer"
showSidebarNavigation = false

[server]
headless = true

[browser]
gatherUsageStats = false
