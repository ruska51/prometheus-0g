[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fif"
version = "0.0.1"
description = "Flame in Freefall: physics-informed fire-safety insights from NASA microgravity combustion data"
requires-python = ">=3.10"
license = "Apache-2.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
